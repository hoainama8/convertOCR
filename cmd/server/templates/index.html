<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to Output Converter</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #173f8f;
      color: #111827;
    }
    .card {
      width: min(760px, calc(100% - 32px));
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      background: white;
    }
    h1 {
      margin-top: 0;
      font-size: 1.9rem;
    }
    p {
      color: #475569;
      line-height: 1.7;
    }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: 600;
    }
    input[type=file] {
      width: 100%;
    }
    select,
    button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      background: white;
      box-sizing: border-box;
    }
    button {
      margin-top: 24px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    .hint {
      color: #64748b;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    main.card > section {
      width: 100%;
      box-sizing: border-box;
    }

    main.card > section img {
      max-width: 100%;
    }

    @media (max-width: 1024px) {
      body {
        align-items: flex-start;
        padding: 24px 12px;
      }

      .card {
        width: min(700px, 100%);
        padding: 24px;
      }

      h1 {
        font-size: 1.65rem;
      }

      p {
        line-height: 1.6;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px 10px;
      }

      .card {
        width: 100%;
        border-radius: 14px;
        padding: 16px;
      }

      h1 {
        font-size: 1.35rem;
      }

      label {
        margin-top: 14px;
      }

      select,
      button,
      input[type=file] {
        font-size: 0.95rem;
      }

      main.card > section {
        max-width: 100% !important;
        padding: 8px !important;
      }

      main.card > section img {
        width: 96px !important;
      }

      main.card > section p {
        font-size: 0.8rem !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Chuyển PDF thành Markdown/JSON/HTML/DOCX/CSV</h1>
    <p>Chọn một hoặc nhiều file PDF, sau đó chọn định dạng đầu ra. Sau khi chuyển đổi, file sẽ được tự động tải về.</p>

    <form action="/convert" method="post" enctype="multipart/form-data">
      <label for="files">Chọn file PDF</label>
      <input id="files" type="file" name="files" accept=".pdf" multiple required />
      <p class="hint">Bạn có thể chọn nhiều file cùng lúc.</p>

      <label for="format">Định dạng đầu ra</label>
      <select id="format" name="format" required>
        <option value="md">Markdown (.md)</option>
        <option value="json">JSON (.json)</option>
        <option value="html">HTML (.html)</option>
        <option value="docx">Word (.docx)</option>
        <option value="csv">CSV (.csv)</option>
      </select>

      <button type="submit">Chuyển đổi và tải về</button>
    </form>
